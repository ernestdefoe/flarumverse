ernestdefoe-flarumverse:
  forum:
    nav: Flarumverse
    page:
      title: Flarumverse
      intro: New discussions from forums paired with {forum}. Each one opens on the forum it was posted on.
      all_forums: All forums
      empty: No discussions from paired forums yet.
      load_more: Load more
      replies: "{count, plural, one {# reply} other {# replies}}"
      on_forum: "on {forum}"

  admin:
    your_address: "Your forum's address:"
    copy: Copy
    copied: Copied
    pair:
      heading: Pair with a forum
      label: Forum address
      placeholder: forum.example.com
      button: Send request
      sent: Request sent to {name}. It shows here as paired once they approve.
    suggestions:
      heading: Suggested
      help: A good first partner. Nothing is sent until you click Send request, and they approve each request.
    sections:
      requests: Requests to approve
      paired: "Paired forums ({count} of {max})"
      waiting: Waiting for their answer
      refused: Declined by them
      declined: Declined by you
      none_paired: Not paired with any forum yet.
    partner:
      approve: Approve
      decline: Decline
      remove: Remove
      cancel: Cancel request
      forget: Forget
      threads: "{count, plural, one {# discussion} other {# discussions}} on your Flarumverse page"
      paired_since: Paired {ago}
      asked: Asked {ago}
      unreachable: "Can't reach this forum at the moment ({error}). Flarumverse keeps trying."
      confirm_remove: "Stop pairing with {name}? Each forum stops showing the other's discussions."
    how:
      heading: How it works
      items:
        shared: Only discussions a guest could read are shared, never private, hidden or restricted ones.
        sent: Each discussion shares its title, the first few lines, the author's name, its tag and the reply count.
        refresh: Flarumverse refreshes every partner every 15 minutes through Flarum's scheduler. With a queue worker running, new discussions are sent the moment they're posted.

  api:
    invalid_address: Enter the forum's web address, like forum.example.com. It must use https.
    own_address: That's this forum's own address.
    not_a_flarumverse_forum: That forum doesn't have Flarumverse installed, or couldn't be reached.
    request_failed: The forum didn't accept the request. Try again later.
    declined_recently: That forum declined a request from you recently.
    they_are_full: That forum already has as many partners as it can.
    they_are_busy: That forum is getting a lot of requests. Try again tomorrow.
    we_are_full: "You already have {max} partners, the most Flarumverse allows."
